<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="currentColor" stroke-width="1">
  <defs>
    <pattern id="tech-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="0.75" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#tech-grid)" opacity="0.4" />
  
  <!-- Subtle coordinate marks & node points -->
  <circle cx="128" cy="96" r="2.5" fill="currentColor" opacity="0.6" />
  <circle cx="320" cy="96" r="1.5" fill="currentColor" opacity="0.4" />
  <circle cx="512" cy="192" r="3" fill="#2563EB" opacity="0.7" />
  <circle cx="704" cy="384" r="2.5" fill="#087443" opacity="0.6" />
  <circle cx="256" cy="416" r="2" fill="currentColor" opacity="0.5" />
  
  <!-- Architectural data curve traces -->
  <path d="M 64 288 Q 256 256 512 192 T 768 128" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4 4" />
  <path d="M 128 96 L 320 96 L 512 192 L 704 384" fill="none" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.75" />
  <path d="M 256 416 Q 448 352 704 384" fill="none" stroke="#087443" stroke-width="1" stroke-opacity="0.25" />
  
  <!-- Subtle tick markers -->
  <line x1="512" y1="186" x2="512" y2="198" stroke="#2563EB" stroke-opacity="0.5" stroke-width="1" />
  <line x1="506" y1="192" x2="518" y2="192" stroke="#2563EB" stroke-opacity="0.5" stroke-width="1" />
</svg>
